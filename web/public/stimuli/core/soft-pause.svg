<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="soft-pause">
  <defs>
    <radialGradient id="gsoftpause" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nsoftpause" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#gsoftpause)"/>
  <rect width="160" height="120" filter="url(#nsoftpause)" opacity="0.85"/>

  <circle cx="80" cy="58" r="28" fill="rgba(255,255,255,0.08)" stroke="#6fbe9a" stroke-width="1.75"/>
  <rect x="68" y="44" width="8" height="28" rx="3" fill="#5ec8d6" opacity="0.85"/>
  <rect x="84" y="44" width="8" height="28" rx="3" fill="#5ec8d6" opacity="0.85"/>

  <!-- pause-label -->
  <text x="80" y="98" text-anchor="middle" fill="#b8c9da" font-size="7" font-family="system-ui,sans-serif" opacity="0.8">Pause</text>
</svg>
