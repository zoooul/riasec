<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="focus-beam">
  <defs>
    <radialGradient id="gfocusbeam" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nfocusbeam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#gfocusbeam)"/>
  <rect width="160" height="120" filter="url(#nfocusbeam)" opacity="0.85"/>

  <circle cx="48" cy="60" r="10" fill="#c9a86a"/>
  <path d="M58 60 L130 36 L130 84 Z" fill="rgba(255,255,255,0.08)" stroke="#5ec8d6" stroke-width="1.5" opacity="0.9"/>
  <path d="M90 52 v16 M106 48 v24" stroke="rgba(184,201,218,0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- beam-cut -->
  <path d="M118 52 h16 M118 68 h10" stroke="#d8899a" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
</svg>
