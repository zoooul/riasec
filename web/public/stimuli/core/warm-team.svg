<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="warm-team">
  <defs>
    <radialGradient id="gwarmteam" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nwarmteam" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#gwarmteam)"/>
  <rect width="160" height="120" filter="url(#nwarmteam)" opacity="0.85"/>

  <circle cx="50" cy="56" r="14" fill="#d8899a" opacity="0.8"/>
  <circle cx="80" cy="48" r="14" fill="#5ec8d6" opacity="0.8"/>
  <circle cx="110" cy="56" r="14" fill="#6fbe9a" opacity="0.8"/>
  <path d="M42 82 H118" stroke="rgba(184,201,218,0.35)" stroke-width="2" stroke-linecap="round"/>

  <!-- team-heart -->
  <path d="M80 64 C73 55, 58 58, 58 68 C58 78, 80 92, 80 92 C80 92, 102 78, 102 68 C102 58, 87 55, 80 64 Z" fill="#d8899a" opacity="0.5"/>
</svg>
