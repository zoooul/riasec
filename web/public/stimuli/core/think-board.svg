<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="think-board">
  <defs>
    <radialGradient id="gthinkboard" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nthinkboard" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#gthinkboard)"/>
  <rect width="160" height="120" filter="url(#nthinkboard)" opacity="0.85"/>

  <rect x="28" y="26" width="104" height="60" rx="10" fill="rgba(255,255,255,0.08)" stroke="#8aa4bc" stroke-width="1.75"/>
  <circle cx="56" cy="52" r="10" fill="none" stroke="#5ec8d6" stroke-width="1.75"/>
  <rect x="78" y="42" width="36" height="24" rx="5" fill="none" stroke="#6fbe9a" stroke-width="1.75"/>
  <path d="M70 86 h20" stroke="rgba(184,201,218,0.35)" stroke-width="3" stroke-linecap="round"/>
</svg>
