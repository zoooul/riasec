<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="lesson-board">
  <defs>
    <radialGradient id="glessonboard" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nlessonboard" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#glessonboard)"/>
  <rect width="160" height="120" filter="url(#nlessonboard)" opacity="0.85"/>

  <rect x="30" y="26" width="100" height="68" rx="10" fill="rgba(255,255,255,0.08)" stroke="#8aa4bc" stroke-width="1.75"/>
  <path d="M46 46 h68 M46 60 h52 M46 74 h60" stroke="#b8c9da" stroke-width="2" stroke-linecap="round"/>
  <rect x="70" y="94" width="20" height="8" rx="2" fill="rgba(184,201,218,0.35)"/>

  <!-- lesson-check -->
  <path d="M42 46 l4 4 8 -9" fill="none" stroke="#6fbe9a" stroke-width="2" stroke-linecap="round"/>
</svg>
