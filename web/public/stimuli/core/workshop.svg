<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="workshop">
  <defs>
    <radialGradient id="gworkshop" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nworkshop" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#gworkshop)"/>
  <rect width="160" height="120" filter="url(#nworkshop)" opacity="0.85"/>

  <rect x="30" y="70" width="100" height="12" rx="3" fill="rgba(255,255,255,0.08)" stroke="#8aa4bc" stroke-width="1.5"/>
  <rect x="58" y="40" width="44" height="30" rx="4" fill="rgba(255,255,255,0.08)" stroke="#5ec8d6" stroke-width="1.75"/>
  <path d="M70 52 h20 M80 42 v20" stroke="#6fbe9a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="48" r="10" fill="#c9a86a" opacity="0.7"/>

  <!-- wrench-tool -->
  <path d="M108 38 a10 10 0 1 0 4 16 l-6 10" fill="none" stroke="#c9a86a" stroke-width="2.25" stroke-linecap="round"/>
</svg>
