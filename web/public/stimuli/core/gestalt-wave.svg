<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="gestalt-wave">
  <defs>
    <radialGradient id="ggestaltwave" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ngestaltwave" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0 0.9  0 0 0 0.045 0"/>
    </filter>
  </defs>
  <rect width="160" height="120" fill="#0a1524"/>
  <rect width="160" height="120" fill="url(#ggestaltwave)"/>
  <rect width="160" height="120" filter="url(#ngestaltwave)" opacity="0.85"/>

